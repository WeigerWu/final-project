# SonarCloud — https://sonarcloud.io
# Fork workflow: fork to weigerwu/final-project → import on SonarCloud → keys below should match.
sonar.organization=weigerwu
sonar.projectKey=weigerwu_final-project
sonar.projectName=Employee Safety Response

sonar.sourceEncoding=UTF-8

# Monorepo sources (TypeScript / JavaScript)
sonar.sources=apps/api/src,apps/web/app,apps/web/components,apps/web/lib,apps/web/i18n,scripts

# Tests (excluded from main-line metrics; included for test-aware rules)
sonar.tests=apps/api/src,apps/api/test,apps/web/e2e
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,apps/web/e2e/**

sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,apps/api/prisma/**,**/*.config.js,**/*.config.ts

# Jest coverage from API unit tests (run `pnpm test:cov` before scan)
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info

# TypeScript analysis
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.json
